# Cloud overlay (ADR 0020): container logs ship to CloudWatch via the
# awslogs driver, authenticated by the instance role. Dual logging keeps
# `docker logs` working. The home server (M9) never applies this file.
# The platform stack is brought up by hand (M6.1 puts it on the pipeline),
# so ENV must be exported for the parameterised awslogs-group to resolve.
# Run as: ENV=prod docker compose -f compose.yml -f compose.cloud.yml -p platform-prod up -d
services:
  caddy:
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-2
        # Parameterised by env (matches the app-side overlay convention) so
        # each env's logs land in its own group; the manual bring-up sets ENV.
        awslogs-group: /wkx/caddy/${ENV:?ENV must be set}
        awslogs-create-group: "false"
        tag: "{{.Name}}"
        mode: non-blocking
        max-buffer-size: "4m"
